name: Run tests

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
        matrix:
            os: [ubuntu-latest, windows-latest]
            python-version: ["3.13"]
            pytest-args: [""]
            include:
              - os: ubuntu-latest
                python-version: "3.12"
                pytest-args: "-m 'not slow'"

    steps:

    - name: checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        # Install a specific version of uv.
        version: "0.12.7"
        python-version: ${{ matrix.python-version }}

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: pre-commit checks
      uses: pre-commit/action@v3.0.1

    - name: Run tests
      env:
        JAX_NUM_CPU_DEVICES: 2
      run: uv run pytest tests ${{ matrix.pytest-args }}
