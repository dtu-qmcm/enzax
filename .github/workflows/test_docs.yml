# This workflow tests whether the documentation builds correctly and runs a
# lighthouse audit.

name: Docs check

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  docs:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        # Install a specific version of uv.
        version: "0.12.7"
        # This job has no matrix, so the version has to be written out. Leaving
        # it unset lets uv fall back to the runner's system Python, which is
        # 3.12; the `mcmc` dependency group only resolves on 3.13.
        python-version: "3.13"

    - name: Install the project
      run: uv sync --all-extras --dev

    - name: build docs with mkdocs
      run: uv run mkdocs build

    - name: Audit with Lighthouse
      uses: treosh/lighthouse-ci-action@v12
      with:
        configPath: ".github/workflows/lighthouserc.json"
        temporaryPublicStorage: true
        uploadArtifacts: true
        runs: 3 # Multiple runs to reduce variance
