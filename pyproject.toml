[project]
name = "enzax"
version = "0.2.3"
description = "Differentiable models of enzyme-catalysed reaction networks"
authors = [
    {name = "Teddy Groves", email = "tedgro@dtu.dk"},
]
dependencies = [
    "blackjax[progress]>=1.6.2",
    "diffrax>=0.7.0",
    "jaxtyping>=0.2.38",
    "arviz>=0.19.0",
    "equinox>=0.11.12",
    "python-libsbml>=5.20.4",
    "sympy2jax>=0.0.5",
    "sbmlmath>=0.2.0",
    "jax>=0.9.0",
    "beartype>=0.22.9",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.32",
    "mkdocstrings>=0.25.2",
    "mkdocstrings-python>=1.10.8",
    "pymdown-extensions>=10.9",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pdm]
distribution = true

[tool.pytest.ini_options]
# equinox warnings that enzax triggers on purpose, suppressed here rather than
# test by test. src/enzax/__init__.py suppresses the same two for running enzax
# outside pytest; pytest resets the warning filters for every test, so
# import-time filters do not reach a test run.
filterwarnings = [
  # equinox counts a numpy array as a JAX array here. enzax's static fields
  # hold numpy arrays describing a model's structure, which is what static
  # fields are for.
  'ignore:A JAX array is being set as static:UserWarning',
  # equinox warns about `init=False` fields because they become PyTree leaves
  # that jax.grad differentiates with respect to. Every `init=False` field in
  # enzax is static too, so none of them is a leaf.
  'ignore:Using `field\(init=False\)` on `equinox.Module`:UserWarning',
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["F722"]
extend-select = ["E501"]  # line length is checked

[tool.ruff.lint.isort]
known-first-party = ["enzax"]

[dependency-groups]
dev = [
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
    "pytest>=9.0.3",
    "requests>=2.32.5",
]
