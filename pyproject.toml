[project]
name = "enzax"
version = "0.8.1"
description = "Differentiable models of enzyme-catalysed reaction networks"
authors = [
    {name = "Teddy Groves", email = "tedgro@dtu.dk"},
]
dependencies = [
    "diffrax>=0.7.0",
    "optimistix>=0.1.0",
    "lineax>=0.1.1",
    "jaxtyping>=0.2.38",
    "equinox>=0.11.12",
    "python-libsbml>=5.20.4",
    "sbmlmath>=0.2.0",
    "sympy>=1.13",
    "jax>=0.9.0",
    "beartype>=0.22.9",
    "requests>=2.32.5",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dae = [
    "diffrax-bdf>=0.1.0",
]
mcmc = [
    "arviz>=0.19.0",
    "blackjax[progress]>=1.6.2",
    "grapevine-mcmc>=0.3.0",
    "teddys-blackjax-utils>=0.2.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.32",
    "mkdocstrings>=0.25.2",
    "mkdocstrings-python>=1.10.8",
    "pymdown-extensions>=10.9",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-n auto --maxprocesses=16"
markers = [
  "slow: takes more than about 20 seconds; deselect with -m 'not slow'",
]
# equinox warnings that enzax triggers on purpose.
# src/enzax/__init__.py suppresses the same two for running enzax outside
# pytest; pytest resets the warning filters for every test, so import-time
# filters do not reach a test run.
filterwarnings = [
  # equinox counts a numpy array as a JAX array here. enzax's static fields
  # hold numpy arrays describing a model's structure, which is what static
  # fields are for.
  'ignore:A JAX array is being set as static:UserWarning',
  # equinox warns about `init=False` fields because they become PyTree leaves
  # that jax.grad differentiates with respect to. Every `init=False` field in
  # enzax is static too, so none of them is a leaf.
  'ignore:Using `field\(init=False\)` on `equinox.Module`:UserWarning',
  # Toy models in the tests often have conserved moieties they don't declare,
  # because they only test rate laws. The tests of the warning itself
  # override this filter.
  'ignore:The balanced species form:UserWarning',
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["F722"]
extend-select = ["E501", "COM812"]  # line length is checked

[tool.ruff.lint.isort]
known-first-party = ["enzax"]

[dependency-groups]
plot = [
    "matplotlib>=3.9",
]
dev = [
    "diffrax-bdf>=0.1.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
    "pytest>=9.0.3",
    "pytest-xdist>=3.6",
]
benchmark = [
    "amici[jax,petab]==1.2.0",
    "diffrax-bdf>=0.1.0",
    "matplotlib>=3.9",
    "pandas>=3.1.0",
    "pymc>=6.4.0",
    "pypesto>=0.8.0",
    "pyyaml>=6.0.3",
]
